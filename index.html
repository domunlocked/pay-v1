<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DomZzz Payment Speaker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
    <style>
        :root {
            color-scheme: dark;
            --primary: #48f5c5;
            --primary-soft: rgba(72, 245, 197, 0.14);
            --bg: #050b14;
            --panel: rgba(10, 22, 35, 0.92);
            --muted: #8ba6b5;
        }
        * { box-sizing: border-box; }
        body {
            position: relative;
            isolation: isolate;
            display: flex;
            min-height: 100vh;
            min-height: 100svh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            margin: 0;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 50% 40%, rgba(10, 83, 86, 0.25), transparent 58%),
                linear-gradient(145deg, #07111c, var(--bg) 65%);
            color: #e7f5f4;
            font-family: 'Khmer OS Battambang', 'Noto Sans Khmer', sans-serif;
        }
        body::before {
            position: fixed;
            z-index: -1;
            inset: 0;
            background-image:
                linear-gradient(rgba(72, 245, 197, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(72, 245, 197, 0.035) 1px, transparent 1px);
            background-size: 36px 36px;
            content: "";
            mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
            pointer-events: none;
        }
        .watermark {
            position: fixed;
            z-index: -1;
            color: var(--primary);
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 900;
            letter-spacing: 0.12em;
            opacity: 0.025;
            pointer-events: none;
            user-select: none;
        }
        .card {
            position: relative;
            width: min(100%, 520px);
            padding: clamp(30px, 7vw, 56px) clamp(20px, 6vw, 48px);
            overflow: hidden;
            border: 1px solid rgba(72, 245, 197, 0.55);
            border-radius: 20px;
            background:
                linear-gradient(145deg, rgba(16, 37, 49, 0.72), transparent 50%),
                var(--panel);
            box-shadow:
                0 0 0 5px rgba(72, 245, 197, 0.035),
                0 24px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px rgba(255, 255, 255, 0.06);
            text-align: center;
            backdrop-filter: blur(14px);
        }
        .card::before,
        .card::after {
            position: absolute;
            top: 0;
            width: 54px;
            height: 3px;
            background: var(--primary);
            box-shadow: 0 0 18px var(--primary);
            content: "";
        }
        .card::before { left: 22px; }
        .card::after { right: 22px; }
        #status {
            min-height: 1.8em;
            margin: 0;
            color: #c1d5db;
            font-size: clamp(1rem, 3.5vw, 1.3rem);
            font-weight: 500;
            line-height: 1.7;
        }
        #amount {
            margin: 26px 0 8px;
            color: var(--primary);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: clamp(3.1rem, 13vw, 5.5rem);
            font-weight: 700;
            letter-spacing: -0.07em;
            line-height: 1.15;
            overflow-wrap: anywhere;
            text-shadow: 0 0 28px rgba(72, 245, 197, 0.38);
        }
        .btn-start {
            min-height: 58px;
            padding: 16px 34px;
            border: 1px solid rgba(72, 245, 197, 0.75);
            border-radius: 10px;
            background: linear-gradient(135deg, #7bffe0, var(--primary));
            box-shadow: 0 0 28px rgba(72, 245, 197, 0.2), inset 0 1px rgba(255, 255, 255, 0.6);
            color: #04140f;
            cursor: pointer;
            font: inherit;
            font-size: clamp(1rem, 4vw, 1.25rem);
            font-weight: 800;
            letter-spacing: 0.03em;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 38px rgba(72, 245, 197, 0.38), inset 0 1px rgba(255, 255, 255, 0.6);
            filter: brightness(1.06);
        }
        .btn-start:active { transform: translateY(0); }
        .btn-start:focus-visible {
            outline: 3px solid #e7f5f4;
            outline-offset: 5px;
        }
        @keyframes paymentGlow {
            0% { transform: scale(1); box-shadow: 0 0 0 5px rgba(72, 245, 197, 0.035), 0 24px 80px rgba(0, 0, 0, 0.45), inset 0 1px rgba(255, 255, 255, 0.06); }
            45% { transform: scale(1.025); box-shadow: 0 0 0 8px rgba(72, 245, 197, 0.1), 0 0 55px rgba(72, 245, 197, 0.34); }
            100% { transform: scale(1); box-shadow: 0 0 0 5px rgba(72, 245, 197, 0.035), 0 24px 80px rgba(0, 0, 0, 0.45), inset 0 1px rgba(255, 255, 255, 0.06); }
        }
        .animate-hit { animation: paymentGlow 0.8s ease-out; }
        @media (max-width: 480px) {
            body { gap: 22px; }
            .card { border-radius: 16px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="watermark">DomZzz</div>

    <button class="btn-start" id="startBtn" onclick="activateSystem()">ចាប់ផ្ដើម (START)</button>

    <div class="card" id="mainCard">
        <h2 id="status">រង់ចាំការបង់ប្រាក់...</h2>
        <div id="amount">---</div>
    </div>

    <audio id="bell" src="bell.mp3" preload="auto"></audio>

    <script>
        const BOT_TOKEN = "8506598103:AAHRwx32M29ynR-6p_7ISNJG3szlQiEAyj4";
        const CHAT_ID = -1003818831389;
        const POLL_INTERVAL_MS = 2000;
        const ALLOWED_UPDATES = encodeURIComponent(JSON.stringify(["message", "edited_message", "channel_post", "edited_channel_post"]));

        let lastUpdateId = -1;
        let active = false;
        let updateTimer = null;
        let updateInFlight = false;

        function setStatus(text) {
            document.getElementById('status').innerText = text;
        }

        function stopPolling() {
            if (updateTimer) {
                clearTimeout(updateTimer);
                updateTimer = null;
            }
            active = false;
        }

        function activateSystem() {
            if (active) return;
            active = true;
            document.getElementById('startBtn').style.display = 'none';
            setStatus("📡 កំពុងរង់ចាំ ABA QR...");

            const bell = document.getElementById('bell');
            bell.play().catch(() => {});
            bell.pause();
            bell.currentTime = 0;

            const wakeup = new SpeechSynthesisUtterance(" ");
            wakeup.lang = 'km-KH';
            window.speechSynthesis.speak(wakeup);

            setTimeout(() => {
                speakKhmer("ប្រព័ន្ធរួចរាល់");
            }, 100);

            update();
        }

        async function update() {
            if (!active || updateInFlight) return;
            updateInFlight = true;

            try {
                const response = await fetch(
                    `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=10&allowed_updates=${ALLOWED_UPDATES}`,
                    { cache: 'no-store' }
                );
                const data = await response.json();
                console.log('Telegram getUpdates response', data);

                if (!data.ok) {
                    if (data.error_code === 409) {
                        stopPolling();
                        setStatus("❌ Another tab, device, or server is polling this bot. Stop the other poller, then reload.");
                        console.warn('Telegram 409 conflict: only one getUpdates client may run at a time.');
                    } else {
                        setStatus(`❌ Telegram error ${data.error_code}`);
                    }
                    return;
                }

                if (!Array.isArray(data.result) || data.result.length === 0) {
                    setStatus("📡 កំពុងរង់ចាំ ABA QR...");
                    return;
                }

                let latestText = null;

                for (const update of data.result) {
                    if (typeof update.update_id !== 'number') continue;
                    if (update.update_id <= lastUpdateId) continue;
                    lastUpdateId = update.update_id;

                    const message = update.message ?? update.channel_post ?? update.edited_message ?? update.edited_channel_post ?? null;
                    if (!message || typeof message !== 'object') continue;

                    const chatId = message.chat?.id;
                    if (chatId !== CHAT_ID) continue;

                    const content = typeof message.text === 'string' && message.text.trim() !== ''
                        ? message.text
                        : typeof message.caption === 'string' && message.caption.trim() !== ''
                            ? message.caption
                            : null;
                    if (!content) continue;

                    latestText = content;
                }

                if (latestText) {
                    setStatus("✅ ចាប់បានសារថ្មី");
                    handlePayment(latestText);
                }
            } catch (error) {
                console.error('Fetch Error', error);
                setStatus("❌ កំហុសក្នុងការទាញព័ត៌មាន");
            } finally {
                updateInFlight = false;
                if (active && !updateTimer) {
                    updateTimer = setTimeout(() => {
                        updateTimer = null;
                        update();
                    }, POLL_INTERVAL_MS);
                }
            }
        }

        function convertKhmerDigits(value) {
            return value.replace(/[០១២៣៤៥៦៧៨៩]/g, (digit) => {
                const map = '០១២៣៤៥៦៧៨៩';
                return map.indexOf(digit).toString();
            });
        }

        function handlePayment(text) {
            const normalizedText = convertKhmerDigits(text).replace(/[,，]/g, '');
            const match = normalizedText.match(/(?:៛|\$)?\s*(\d+(?:\.\d+)?)/);
            if (!match) {
                console.log('No amount found in message:', text);
                setStatus('⚠️ មិនមានទឹកប្រាក់ទេ');
                return;
            }

            const rawValue = parseFloat(match[1]);
            if (!Number.isFinite(rawValue)) {
                console.log('Invalid numeric value:', match[1]);
                setStatus('⚠️ ទឹកប្រាក់មិនត្រឹមត្រូវ');
                return;
            }

            const currency = (/\$|USD/i.test(text)) ? 'ដុល្លារ' : 'រៀល';
            const symbol = currency === 'ដុល្លារ' ? '$' : '៛';
            const formattedValue = Number.isInteger(rawValue)
                ? rawValue.toLocaleString()
                : rawValue.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            const sentence = `បានទទួលទឹកប្រាក់ចំនួន ${formattedValue} ${currency}`;
            document.getElementById('amount').innerText = formattedValue + symbol;
            setStatus(sentence);

            const card = document.getElementById('mainCard');
            card.classList.remove('animate-hit');
            void card.offsetWidth;
            card.classList.add('animate-hit');

            const bell = document.getElementById('bell');
            bell.currentTime = 0;
            bell.play().catch(() => console.log('Audio Blocked'));
            setTimeout(() => speakKhmer(sentence), 800);
        }

        function speakKhmer(text) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'km-KH';
            utter.rate = 0.9;
            utter.pitch = 1.0;
            utter.volume = 1.0;
            window.speechSynthesis.speak(utter);
        }
    </script>
</body>
</html>
